apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-green
  namespace: webapps         # 👈 Bound to your webapps namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankapp
      version: green
  template:
    metadata:
      labels:
        app: bankapp
        version: green
    spec:
      containers:
      - name: bankapp
        image: ramkuumar/bankapp:green1 # Adjust the image tag for the green version
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          // 👈 Pointed directly to your PostgreSQL Service mesh
          value: jdbc:postgresql://bank-postgres:5432/bankappdb
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          value: root
        resources:
          requests:
            memory: "500Mi"
            cpu: "500m"
          limits:
            memory: "1000Mi"
            cpu: "1000m"
