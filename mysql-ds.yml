# PostgreSQL Deployment with Resource Requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-postgres
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bank-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: bankappdb
        - name: POSTGRES_USER
          value: root
        - name: POSTGRES_PASSWORD
          value: root
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: mysql-pvc        # 🔥 LINK PVC
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: bank-postgres
  namespace: webapps
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: bank-postgres
