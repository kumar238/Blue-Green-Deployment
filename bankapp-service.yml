apiVersion: v1
kind: Service
metadata:
  name: bankapp-service
  namespace: webapps         # 👈 Added to match your workspace namespace
spec:
  type: NodePort             # 👈 Changed from LoadBalancer to NodePort for local Minikube
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080          # 👈 Fixed external Windows host mapping port (Optional)
  selector:
    app: bankapp
    version: blue # This can be changed to "green" when switching traffic
